services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nominate
      POSTGRES_PASSWORD: nominate
      POSTGRES_DB: nominate
    ports:
      - "5432:5432"
    volumes:
      - nominate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nominate"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nominate_pgdata:
