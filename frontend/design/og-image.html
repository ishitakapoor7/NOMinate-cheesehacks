<!doctype html><html lang="en"><head><meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@500&family=Instrument+Sans:wght@500;600&display=swap" rel="stylesheet" />
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1200px;height:630px}
.card{width:1200px;height:630px;background:#fff;color:#111;border:10px solid #111;padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between;font-family:'Instrument Sans',Arial,sans-serif;position:relative}
.top{display:flex;align-items:center;justify-content:space-between}
.wm{display:flex;align-items:flex-end;gap:8px}
.wm .n{font-family:'Anton',sans-serif;font-size:40px;line-height:0.8}
.wm .sq{width:15px;height:15px;background:#FFC700;border:2px solid #111;margin-bottom:3px}
.tag{font-family:'IBM Plex Mono',monospace;font-size:18px;letter-spacing:0.18em;color:#6E6E6E}
.h{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:170px;line-height:0.9;letter-spacing:1px;position:relative;display:inline-block}
.h .sq{display:inline-block;width:34px;height:34px;background:#FFC700;border:4px solid #111;margin-left:12px;vertical-align:12px}
.chips{display:flex;gap:14px}
.chip{font-family:'IBM Plex Mono',monospace;font-size:18px;letter-spacing:0.12em;border:2px solid #111;border-radius:999px;padding:11px 24px}
.chip.f{background:#111;color:#fff}
</style></head>
<body><div class="card">
  <div class="top"><div class="wm"><span class="n">NOMINATE</span><span class="sq"></span></div><span class="tag">A DAILY MEAL PICK</span></div>
  <div class="h">WHAT&rsquo;S FOR<br />DINNER?<span class="sq"></span></div>
  <div class="chips"><span class="chip f">ITALIAN</span><span class="chip">THAI</span><span class="chip">INDIAN</span><span class="chip">KOREAN</span><span class="chip">+ 16 MORE</span></div>
</div></body></html>
