<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#111111" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>NOMinate — daily meal nominations</title>
    <meta
      name="description"
      content="One dinner a day, nominated for you — tailored to your diet, skill level, and pantry, powered by a PyTorch recommender that learns your taste over time."
    />

    <!-- Open Graph (LinkedIn, Facebook, iMessage, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nominate-web.onrender.com/" />
    <meta property="og:title" content="NOMinate — a daily meal recommender" />
    <meta
      property="og:description"
      content="Solves 'what's for dinner' with one dish a day, tailored to your diet, skill level, and pantry — then cook it or order it out."
    />
    <meta property="og:image" content="https://nominate-web.onrender.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NOMinate — one dinner, nominated daily" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NOMinate — a daily meal recommender" />
    <meta
      name="twitter:description"
      content="Solves 'what's for dinner' with one dish a day, tailored to your diet, skill level, and pantry."
    />
    <meta name="twitter:image" content="https://nominate-web.onrender.com/og-image.png" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
