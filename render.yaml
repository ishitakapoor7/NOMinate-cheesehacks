# Render blueprint — https://render.com/docs/blueprint-spec
# Deploys the Postgres database, Flask API, and React static frontend.
# After the first deploy, set the two cross-service URLs in the dashboard
# (see the notes marked "set after first deploy" below).

databases:
  - name: nominate-db
    databaseName: nominate
    user: nominate
    plan: free

services:
  # ── Flask API ──────────────────────────────────────────────────────────────
  - type: web
    name: nominate-api
    runtime: python
    rootDir: backend
    plan: free
    # Install the CPU-only torch (far smaller / less memory than the default
    # CUDA build) before the rest of the requirements.
    buildCommand: pip install torch==2.12.0 --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    # Migrate + seed run at startup so they have DB access; both are idempotent.
    # gunicorn.conf.py sets workers/timeout/bind and warms the model at boot.
    startCommand: flask --app wsgi db upgrade && python seed.py && gunicorn wsgi:app -c gunicorn.conf.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: DATABASE_URL
        fromDatabase:
          name: nominate-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      # set after first deploy → the frontend's URL, e.g. https://nominate-web.onrender.com
      - key: CORS_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: SPOONACULAR_API_KEY
        sync: false

  # ── React frontend (static) ──────────────────────────────────────────────────
  - type: web
    name: nominate-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # SPA: serve index.html for client-side routes
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # set after first deploy → the API's URL, e.g. https://nominate-api.onrender.com
      - key: VITE_API_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
